<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PoliticsHub Reel Template</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--pg:#f1f1ef;--pt:#141414;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--pg:#0b0b0c;--pt:#eee}}
:root[data-theme=dark]{--pg:#0b0b0c;--pt:#eee}
html,body{height:100%}body{margin:0;background:var(--pg);color:var(--pt);font:14px Inter,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#w{position:relative;overflow:hidden;box-shadow:0 8px 40px #0005}
#ui{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:min(92vw,520px)}#ui input{flex:1;min-width:120px}#ui button,#ui select{font:inherit;padding:6px 10px}
#st{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#050506;overflow:hidden;transform-origin:0 0;color:#fff;font-family:Inter,Arial,sans-serif;--ac:#e63946;--on:#fff}
#st div{position:absolute}
.l{background:rgba(255,255,255,.09)}
.m{font:500 30px 'JetBrains Mono',monospace;letter-spacing:3px;white-space:nowrap;text-transform:uppercase}
.pin{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--ac);margin-right:14px}
.cat{background:var(--ac);color:var(--on);font:800 58px/92px 'Barlow Condensed',Impact,sans-serif;letter-spacing:7px;padding:0 36px;height:92px;white-space:nowrap;text-transform:uppercase}
.gh{font:800 330px/1 'Barlow Condensed',Impact,sans-serif;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.2);white-space:nowrap;text-transform:uppercase}
.hl{font:800 100px/.98 'Barlow Condensed','Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:-.5px;text-wrap:balance}
.sm{font:500 34px/1.38 Inter,Arial,sans-serif;color:#ececec}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.08em .05em .06em;margin:-.08em -.05em -.06em}
.i{display:inline-block}.k{color:var(--ac)}
.lt{height:84px;background:#fff;color:#000;display:flex;overflow:hidden;font:800 40px/84px 'Barlow Condensed',Impact,sans-serif;text-transform:uppercase}
.lt b{background:var(--ac);color:var(--on);padding:0 30px;letter-spacing:6px}.lt span{padding:0 30px;white-space:nowrap}
.pn{overflow:hidden;background:#111}
</style></head><body>
