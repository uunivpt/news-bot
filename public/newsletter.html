<main class="wrap"><article class="art"><div class="ah"><span class="lbl red">Newsletter</span><h1>Newsletter</h1><p class="dek">Get important PoliticsHub.in updates without checking the site every hour.</p></div><div class="body"><form id="nl" style="max-width:620px"><label>Email address</label><input id="email" type="email" required placeholder="you@example.com" style="width:100%;padding:14px;border-radius:14px;border:1px solid #ccc;margin:10px 0"><button class="btn" type="submit">Subscribe</button><p id="msg" class="msg" style="padding:20px 0;text-align:left"></p></form><script>document.getElementById('nl').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('msg');try{const r=await fetch('/api/newsletter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const j=await r.json();m.textContent=j.message||j.error||'Done';if(r.ok)e.target.reset()}catch(x){m.textContent='Could not subscribe right now.'}})</script></div></article></main>
