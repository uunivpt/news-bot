<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>PoliticsHub.in — Story</title><style>
:root{--bg:#08090d;--panel:#10121a;--line:#242733;--text:#f6f7fb;--muted:#9096a5;--accent:#ff4f70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:#08090de8;backdrop-filter:blur(16px);z-index:5}.topin{height:66px;max-width:1050px;margin:auto;padding:0 18px;display:flex;align-items:center}.logo{width:150px;height:45px;object-fit:contain;object-position:left}.back{margin-left:auto;color:#9ba1af;text-decoration:none;font-size:10px;font-weight:800}.wrap{max-width:900px;margin:auto;padding:35px 20px 70px}.tag{font-size:9px;color:var(--accent);font-weight:900;letter-spacing:.15em;text-transform:uppercase}.title{font-size:clamp(32px,5vw,58px);line-height:1.03;letter-spacing:-2px;margin:9px 0}.time{font-size:9px;color:#717887;margin-top:12px}.hero{display:block;width:100%;max-height:530px;object-fit:cover;border-radius:17px;margin:24px 0;border:1px solid var(--line)}.article{font-family:Georgia,serif;font-size:19px;line-height:1.82;color:#d8dbe2}.article p{margin:0 0 22px}.article .section{font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:30px 0 8px}.source{margin-top:30px;padding-top:15px;border-top:1px solid var(--line);font:10px Inter,system-ui,sans-serif;color:#737b8b}.source a{color:#a7caff}.loading,.error{padding:60px 0;color:#777f8f;font-size:12px}@media(max-width:600px){.wrap{padding:25px 15px 55px}.article{font-size:17px;line-height:1.75}.title{letter-spacing:-1.2px}.hero{margin:20px 0;border-radius:12px}}</style></head><body><header class="top"><div class="topin"><a href="/"><img class="logo" src="/brand.svg" alt="PoliticsHub.in"></a><a class="back" href="/">← BACK TO NEWS</a></div></header><main class="wrap" id="app"><div class="loading">Loading story…</div></main><script>
const app=document.getElementById("app"),id=new URLSearchParams(location.search).get("id"),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function load(){if(!id){app.innerHTML='<div class="error">Story not found.</div>';return}try{const r=await fetch("/api/news/"+encodeURIComponent(id)),n=await r.json();if(!r.ok||!n.article)throw Error();const paragraphs=String(n.article).split(/\n\s*\n/).filter(Boolean).map(p=>{const m=p.match(/^(What happened|Key details|What is known|Context|What comes next|Additional details):\s*(.*)$/s);return m?'<div class="section">'+esc(m[1])+'</div><p>'+esc(m[2])+'</p>':'<p>'+esc(p)+'</p>'}).join("");document.title=(n.title||"Story")+" — PoliticsHub.in";app.innerHTML='<div class="tag">'+esc(n.category||"News")+'</div><h1 class="title">'+esc(n.title)+'</h1><div class="time">'+esc(n.published_at||"")+'</div>'+(n.image_url?'<img class="hero" src="'+esc(n.image_url)+'" alt="">':"")+'<article class="article">'+paragraphs+'</article>'+(n.source_name?'<div class="source">Source: '+(n.url?'<a href="'+esc(n.url)+'" target="_blank" rel="noopener noreferrer">'+esc(n.source_name)+'</a>':esc(n.source_name))+'</div>':"")}catch(e){app.innerHTML='<div class="error">This story is not available.</div>'}}load();
</script></body></html>
