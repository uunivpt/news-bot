<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>PoliticsHub.in — Story</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#050505;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;background:#050505}.top{border-bottom:1px solid #202025}.topin{max-width:1000px;height:64px;margin:auto;padding:0 18px;display:flex;align-items:center}.logo{width:150px;height:48px;object-fit:contain;object-position:left}.back{margin-left:auto;color:#aaa;font-size:11px;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:35px 20px 70px}.tag{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#ff5272;font-weight:900}.time{font-size:10px;color:#777880;margin-top:12px}.title{font-size:clamp(30px,5vw,55px);line-height:1.05;letter-spacing:-1.7px;margin:10px 0 0}.hero{width:100%;max-height:500px;object-fit:cover;border-radius:16px;margin:25px 0}.article{font-family:Georgia,serif;font-size:19px;line-height:1.78;color:#ddd}.article p{margin:0 0 22px}.article .section{font-family:Inter,system-ui,sans-serif;font-size:12px;line-height:1.5;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#ff5272;margin:30px 0 8px}.loading,.error{padding:50px 0;color:#888;font-size:13px}@media(max-width:600px){.wrap{padding:25px 15px 55px}.article{font-size:17px;line-height:1.7}.hero{margin:20px 0;border-radius:12px}}</style></head><body><header class="top"><div class="topin"><a href="/"><img class="logo" src="/brand.svg" alt="PoliticsHub.in"></a><a class="back" href="/">← Back to news</a></div></header><main class="wrap" id="app"><div class="loading">Loading story…</div></main><script>const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));async function load(){if(!id){app.innerHTML='<div class="error">Story not found.</div>';return}try{const r=await fetch('/api/news/'+encodeURIComponent(id));const n=await r.json();if(!r.ok||!n.article)throw 0;const paragraphs=String(n.article).split(/\n\s*\n/).filter(Boolean).map(p=>{const m=p.match(/^(What happened|Key details|What is known|Context|What comes next):\s*(.*)$/s);return m?`<div class="section">${esc(m[1])}</div><p>${esc(m[2])}</p>`:`<p>${esc(p)}</p>`}).join('');document.title=(n.title||'Story')+' — PoliticsHub.in';app.innerHTML=`<div class="tag">${esc(n.category||'News')}</div><h1 class="title">${esc(n.title)}</h1><div class="time">${esc(n.published_at||'')}</div>${n.image_url?`<img class="hero" src="${esc(n.image_url)}" alt="">`:''}<article class="article">${paragraphs}</article>`}catch(e){app.innerHTML='<div class="error">This story is not available.</div>'}}load();</script></body></html>
