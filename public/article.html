nt.getElementById("a"),id=new URLSearchParams(location.search).get("id"),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));(async()=>{if(!id){a.innerHTML="<h1>Article not found</h1>";return}try{const r=await fetch("/api/news/"+encodeURIComponent(id)),n=await r.json();if(!r.ok)throw Error();document.title=(n.title||"Article")+" — PoliticsHub.in";a.innerHTML='<div class="tag">'+esc(n.category||"News")+'</div><h1>'+esc(n.title)+'</h1><div class="meta">'+esc(n.published_at||"")+' · '+esc(n.source_name||"")+'</div>'+(n.image_url?'<img class="hero" src="'+esc(n.image_url)+'" alt="">':"")+'<div class="text">'+esc(n.article||n.summary||"")+'</div>'+(n.source_name?'<div class="source">Source: '+(n.url?'<a href="'+esc(n.url)+'" target="_blank" rel="noopener noreferrer">'+esc(n.source_name)+'</a>':esc(n.source_name))+'<div class="note">PoliticsHub.in links to the original source and publishes its own summary/context.</div></div>':"")}catch(e){a.innerHTML="<h1>Article unavailable</h1><p style='color:#8992a2'>The requested story could not be loaded.</p>"}})()</script></body></html>
