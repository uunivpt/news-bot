<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NewsDesk Article</title><style>body{margin:0;background:#f5f6f8;color:#101828;font-family:system-ui}.wrap{max-width:900px;margin:30px auto;padding:20px}.article{background:#fff;padding:30px;border-radius:20px}.hero{width:100%;max-height:520px;object-fit:cover;border-radius:15px}h1{font-size:42px;line-height:1.15}.meta{color:#667085}.text{font-size:19px;line-height:1.75;white-space:pre-wrap}.source{margin-top:25px;padding:15px;background:#f2f4f7;border-radius:10px}a{color:#175cd3;font-weight:700}</style></head><body><main class="wrap"><article class="article" id="a">Loading…</article></main><script>const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));(async()=>{const id=new URLSearchParams(location.search).get('id');const r=await fetch('/api/news/'+id);const n=await r.json();if(!r.ok){a.innerHTML='<h1>Article not found</h1>';return}a.innerHTML=`${n.image_url?`<img class="hero" src="${esc(n.image_url)}">`:''}<div class="meta">${esc(n.category)} · ${esc(n.source_name)} · ${esc(n.published_at||'')}</div><h1>${esc(n.title)}</h1><div class="text">${esc(n.ai_article||n.ai_summary||n.summary||'')}</div><div class="source">Original source: <a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.source_name)}</a></div>`})()</script></body></html>
