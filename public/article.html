</style></head><body><header class="top">politicshub.in</header><main class="wrap"><article class="article" id="a">Loading article…</article></main><script>const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){a.innerHTML='<h1>Article not found</h1>';return}const r=await fetch('/api/news/'+encodeURIComponent(id));const n=await r.json();if(!r.ok){a.innerHTML='<h1>Article not found</h1>';return}const source=n.source_name?(n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.source_name)}</a>`:esc(n.source_name)):'';a.innerHTML=`<a class="back" href="/">← Back to politicshub.in</a>${n.image_url?`<img class="hero" src="${esc(n.image_url)}" alt="">`:''}<div class="meta">${esc(n.category)} · ${esc(n.source_name||'')} · ${esc(n.published_at||'')}</div><h1>${esc(n.title)}</h1><div class="text">${esc(n.article||n.summary||'')}</div>${source?`<div class="source">Source: ${source}<div class="note">politicshub.in links to the original source and publishes its own summary/context. Source material is not presented as our original reporting.</div></div>`:''}`})()</script></body></html>
