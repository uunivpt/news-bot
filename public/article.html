<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0d"><title>Article — PoliticsHub.in</title><style>:root{--bg:#080a0d;--line:#252a32;--muted:#8d96a4;--soft:#bcc4ce;--red:#ff3d62;--max:980px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f5f7;font-family:Arial,Helvetica,sans-serif}.top{height:70px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;background:#080a0df2;backdrop-filter:blur(14px)}.topin{height:100%;max-width:1200px;margin:auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between}.logo{width:140px;height:46px}.back{font-size:10px;font-weight:800;letter-spacing:.08em;color:#9ba4b1;text-decoration:none}.page{max-width:var(--max);margin:auto;padding:45px 22px 80px}.tag{color:var(--red);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.title{font-size:clamp(34px,6vw,66px);line-height:1.02;letter-spacing:-2.5px;margin:12px 0 18px}.dek{font-size:17px;line-height:1.65;color:var(--soft);max-width:850px}.meta{font-size:10px;color:#747e8c;margin-top:17px;padding-bottom:24px;border-bottom:1px solid var(--line)}.hero{width:100%;max-height:570px;object-fit:cover;display:block;margin:28px 0 35px}.article{font-size:18px;line-height:1.85;color:#d2d7de;white-space:pre-wrap;max-width:800px}.source{max-width:800px;margin-top:35px;padding-top:15px;border-top:1px solid var(--line);font-size:11px;color:#818b99}.source a{color:#b7c0cc}.note{font-size:10px;color:#626c7a;margin-top:6px}@media(max-width:600px){.top{height:60px}.topin{padding:0 14px}.logo{width:125px}.page{padding:30px 15px 60px}.title{font-size:39px;letter-spacing:-1.2px}.dek{font-size:15px}.article{font-size:16px;line-height:1.75}.hero{margin:22px 0 27px}}</style></head><body><header class="top"><div class="topin"><a href="/"><img class="logo" src="/brand.svg" alt="PoliticsHub.in"></a><a class="back" href="/">← BACK TO NEWS</a></div></header><main class="page" id="page"><div class="tag">PoliticsHub</div><h1 class="title">Loading article…</h1></main><script>const p=document.getElementById("page"),id=new URLSearchParams(location.search).get("id"),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])),valid=v=>{const s=String(v||"").trim();return s&&!/placeholder|default[-_ ]?image|no[-_ ]?image|noimage|blank[-_ ]?image|black[-_ ]?image|dummy[-_ ]?image/i.test(s)};const fmt=v=>{if(!v)return"";const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})};(async()=>{try{if(!id)throw Error();const r=await fetch("/api/news/"+encodeURIComponent(id)),n=await r.json();if(!r.ok)throw Error();document.title=(n.title||"Article")+" — PoliticsHub.in";p.innerHTML='<div class="tag">'+esc(n.category||"News")+'</div><h1 class="title">'+esc(n.title)+'</h1><div class="dek">'+esc(n.summary||n.bot_summary||"")+'</div><div class="meta">'+fmt(n.published_at)+' · '+esc(n.source_name||"")+'</div>'+(valid(n.image_url)?'<img class="hero" src="'+esc(n.image_url)+'" alt="" onerror="this.remove()">':"")+'<div class="article">'+esc(n.article||n.bot_article||n.summary||"")+'</div>'+(n.source_name?'<div class="source">Source: '+(n.url?'<a href="'+esc(n.url)+'" target="_blank" rel="noopener noreferrer">'+esc(n.source_name)+'</a>':esc(n.source_name))+'<div class="note">Source attribution is provided for the published story.</div></div>':"")}catch(e){p.innerHTML='<div class="tag">PoliticsHub</div><h1 class="title">Article unavailable</h1><p style="color:#8d96a4">The requested story could not be loaded.</p>'}})()</script></body></html>
