<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>Settings — PoliticsHub.in</title><style>:root{--l:#222733}*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f4f6fa;font:14px/1.6 Inter,system-ui,sans-serif}.w{max-width:850px;margin:auto;padding:24px 18px 70px}.top{height:60px;border-bottom:1px solid var(--l);display:flex;align-items:center}.top img{width:130px;height:45px}.back{color:#9ca5b5;text-decoration:none;font-size:12px}.c{margin-top:22px;background:#10131a;border:1px solid var(--l);border-radius:18px;padding:22px}.row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:17px 0;border-top:1px solid var(--l)}.muted{color:#9ca5b5;font-size:12px}.btn{background:#fff;color:#090b10;border:0;border-radius:9px;padding:10px 14px;font-weight:800}.danger{background:#2a151b;color:#ff9bad;border:1px solid #4b252e}</style></head><body><main class="w"><header class="top"><a href="/"><img src="/brand.svg" alt="PoliticsHub.in"></a></header><a class="back" href="/">← Back to newsroom</a><section class="c"><h1>Site Settings</h1><p class="muted">These controls affect this browser only.</p><div class="row"><div><b>Cookie consent</b><div class="muted" id="s">Checking…</div></div><button class="btn" id="r">Reset</button></div><div class="row"><div><b>Clear local preferences</b><div class="muted">Remove PoliticsHub data saved in this browser.</div></div><button class="btn danger" id="c">Clear</button></div></section></main><script>const s=document.getElementById("s"),show=()=>s.textContent=localStorage.getItem("ph_cookie_consent")?"Accepted":"Not set";r.onclick=()=>{localStorage.removeItem("ph_cookie_consent");show()};c.onclick=()=>{localStorage.clear();show();alert("Local PoliticsHub data cleared.")};show()</script></body></html>
