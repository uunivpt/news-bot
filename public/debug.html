<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>System Status — PoliticsHub.in</title><style>:root{--bg:#090b10;--p:#10131a;--l:#242a35;--m:#8f98a8;--ok:#66e6a0;--bad:#ff607b;--a:#ff4668}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f6fa;font:14px/1.6 Inter,system-ui,sans-serif}.top{height:70px;border-bottom:1px solid var(--l);background:rgba(9,11,16,.94);display:flex;align-items:center}.topin,.wrap{max-width:900px;margin:auto;width:100%;padding:0 18px}.topin{display:flex;align-items:center;justify-content:space-between}.logo{width:140px;height:45px}.back{color:var(--m);text-decoration:none;font-size:11px;font-weight:750}.wrap{padding-top:30px;padding-bottom:70px}.head{display:flex;align-items:center;gap:12px}.statusdot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 15px #66e6a055}.head h1{margin:0;font-size:28px;letter-spacing:-.8px}.sub{color:var(--m);font-size:12px;margin:6px 0 22px}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 0;border-top:1px solid var(--l)}.row:first-child{border-top:0}.name{font-weight:750}.desc{font-size:10px;color:var(--m);margin-top:2px}.result{font-size:10px;font-weight:850}.ok{color:var(--ok)}.bad{color:var(--bad)}button{margin-top:16px;background:#fff;color:#090b10;border:0;border-radius:7px;padding:10px 14px;font-weight:850;font-size:11px;cursor:pointer}footer{margin-top:20px;color:#626b7a;font-size:10px}footer a{color:#8993a2;text-decoration:none;margin-right:14px}@media(max-width:600px){.top{height:60px}.logo{width:125px}.wrap{padding-top:22px}.head h1{font-size:23px}}</style></head><body><header class="top"><div class="topin"><a href="/"><img class="logo" src="/brand.svg" alt="PoliticsHub.in"></a><a class="back" href="/">← NEWSROOM</a></div></header><main class="wrap"><div class="head"><span class="statusdot"></span><div><h1>System Status</h1><div class="sub">Public service diagnostics · no private/admin data shown</div></div></div><section class="card" id="checks"></section><button id="run">Run checks</button><footer><a href="/privacy.html">Privacy</a><a href="/cookies.html">Cookies</a><a href="/settings.html">Settings</a></footer></main><script>const box=document.getElementById("checks");async function run(){const tests=[["Website","Main newsroom is reachable",()=>fetch("/").then(r=>{if(!r.ok)throw Error();})],["News API","Published news endpoint",()=>fetch("/api/news?limit=1").then(r=>{if(!r.ok)throw Error();})],["Browser storage","Local preference storage",()=>Promise.resolve(!!window.localStorage)]];box.innerHTML="";for(const [n,d,fn] of tests){const t=performance.now();try{await fn();box.innerHTML+='<div class="row"><div><div class="name">'+n+'</div><div class="desc">'+d+'</div></div><span class="result ok">ONLINE · '+Math.round(performance.now()-t)+' ms</span></div>'}catch(e){box.innerHTML+='<div class="row"><div><div class="name">'+n+'</div><div class="desc">'+d+'</div></div><span class="result bad">CHECK FAILED</span></div>'}}}document.getElementById("run").onclick=run;run()</script></body></html>
