<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="robots" content="noindex,nofollow,noarchive"><title>PoliticsHub Secure Newsroom</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#111;background:#f4f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border:1px solid #ddd;border-radius:20px;padding:14px 18px;position:sticky;top:12px;z-index:3;box-shadow:0 12px 35px #0000000d}.brand{font-weight:800;font-size:20px}.mut{color:#777}.btn{border:0;border-radius:12px;padding:10px 14px;background:#111;color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#eee;color:#111}.btn.red{background:#c8102e}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:18px}.num{font-size:34px;font-weight:800}.label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#777}.panel{background:#fff;border:1px solid #ddd;border-radius:20px;padding:20px;margin:16px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #eee;vertical-align:top}th{font-size:12px;text-transform:uppercase;color:#777}.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:#aaa}.ok:before{background:#1f9d55}.bad:before{background:#c8102e}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input{width:100%;border:1px solid #ccc;border-radius:12px;padding:13px;font:inherit;margin:6px 0 12px}form{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:24px;border:1px solid #ddd;box-shadow:0 20px 50px #0001}h1{margin:0 0 8px}h2{margin:0 0 14px}small{color:#777}.hidden{display:none}.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:12px 16px;border-radius:12px;display:none}.danger{color:#c8102e;font-weight:700}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}table{font-size:13px}.hide-sm{display:none}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr}.num{font-size:28px}}
</style><link rel="stylesheet" href="/assets/admin-polish.css?v=phui19"></head>
<body>
<div id="login">
<form id="loginForm"><div class="label">PoliticsHub.in</div><h1>Newsroom Admin</h1><p class="mut">Secure command center</p><label>Username<input id="user" autocomplete="username" required></label><label>Password<input id="pass" type="password" autocomplete="current-password" required></label><button class="btn red" style="width:100%">Sign in</button><p id="loginMsg" class="danger"></p></form>
</div>
<div id="app" class="hidden"><div class="wrap">
<header class="bar"><div><div class="brand">PoliticsHub Admin</div><small id="who"></small></div><div class="row"><button class="btn alt" id="refresh">Refresh</button><button class="btn" id="logout">Sign out</button></div></header>
<section class="grid" id="stats"></section>
<section class="panel"><div class="row" style="justify-content:space-between"><h2>System health</h2><span id="updated" class="mut"></span></div><div id="health" class="row"></div></section>
<section class="panel"><div class="row" style="justify-content:space-between"><h2>Latest newsroom</h2><input id="filter" style="max-width:280px;margin:0" placeholder="Filter headlines"></div><div style="overflow:auto"><table><thead><tr><th>Story</th><th>Desk</th><th>Status</th><th>Score</th><th>Instagram</th></tr></thead><tbody id="news"></tbody></table></div></section>
<section class="panel"><h2>Security posture</h2><div class="row"><span class="status ok">CSRF protection</span><span class="status ok">Login throttling</span><span class="status ok">Secure session cookie</span><span class="status ok">CSP / HSTS headers</span><span class="status ok">Public API rate limit</span></div></section>
</div></div><div id="toast" class="toast"></div>
<script src="/assets/newsroom-console.js?v=phui19" defer></script></body></html>
