<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>PoliticsHub.in — Live News</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#050505;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;background:#050505}.top{position:sticky;top:0;z-index:5;background:#070707ee;backdrop-filter:blur(14px);border-bottom:1px solid #202025}.topin{max-width:1200px;margin:auto;height:64px;padding:0 18px;display:flex;align-items:center;gap:14px}.logo{width:155px;height:48px;object-fit:contain;object-position:left}.live{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.1em}.live:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff3157;margin-right:6px}.nav{border-bottom:1px solid #1b1b20;overflow:auto}.navin{max-width:1200px;margin:auto;display:flex;white-space:nowrap}.nav a{padding:12px 10px;color:#8b8c94;font-size:11px;font-weight:800;text-decoration:none}.nav a.active,.nav a:hover{color:#fff}.wrap{max-width:1200px;margin:auto;padding:20px}.hero{display:grid;grid-template-columns:1.6fr .8fr;gap:14px}.lead{min-height:430px;border:1px solid #222329;border-radius:18px;overflow:hidden;position:relative;background:#101014}.lead img{width:100%;height:430px;object-fit:cover;opacity:.65}.lead:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,#050505f5 100%)}.copy{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:26px}.tag{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#ff5272;font-weight:900}.copy h1{font-size:clamp(27px,4vw,48px);line-height:1.06;letter-spacing:-1.4px;margin:9px 0}.copy p{font-size:14px;line-height:1.55;color:#c5c5cb;margin:0;max-width:780px}.time{font-size:10px;color:#777880;margin-top:12px}.side{border:1px solid #222329;border-radius:18px;background:#0c0c0f;padding:16px}.side h2{font-size:15px;margin:0 0 5px}.story{display:block;padding:14px 0;border-top:1px solid #1f2024;color:#fff;text-decoration:none}.story:first-of-type{border-top:0}.story b{display:block;font-size:13px;line-height:1.35}.story span{display:block;color:#777880;font-size:9px;margin-top:6px}.bar{display:flex;gap:7px;margin:16px 0;position:sticky;top:64px;z-index:4;background:#08080aee;padding:8px;border:1px solid #202126;border-radius:12px;backdrop-filter:blur(10px)}input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:8px;font-size:12px}button{border:1px solid #25262b;background:#101014;color:#999aa2;border-radius:8px;padding:8px 11px;font-size:10px;font-weight:800;cursor:pointer}button.on,button:hover{color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid #222329;border-radius:14px;overflow:hidden;background:#0c0c0f;text-decoration:none;color:#fff}.card img{display:block;width:100%;height:165px;object-fit:cover;background:#111}.body{padding:12px}.cat{font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:#8c8d95;font-weight:900}.card h3{font-size:14px;line-height:1.35;margin:7px 0}.card p{font-size:10px;line-height:1.5;color:#92939a;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.card .time{margin-top:10px}.empty{grid-column:1/-1;padding:40px;text-align:center;border:1px dashed #28292e;border-radius:14px;color:#777880;font-size:12px}.footer{border-top:1px solid #202126;margin-top:40px;padding:20px 0;color:#6f7077;font-size:10px}@media(max-width:900px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.wrap{padding:12px}.topin{height:58px;padding:0 12px}.logo{width:140px}.nav a{padding:11px 9px}.lead,.lead img{height:370px;min-height:370px}.copy{padding:19px}.copy h1{font-size:29px}.copy p{font-size:12px}.bar{top:58px;flex-wrap:wrap}.bar input{flex-basis:100%}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.card img{height:125px}.card h3{font-size:12px}}@media(max-width:410px){.grid{grid-template-columns:1fr}.card img{height:185px}}</style></head><body><header class="top"><div class="topin"><a href="/"><img class="logo" src="/brand.svg" alt="PoliticsHub.in"></a><span class="live">LIVE NEWS</span></div></header><nav class="nav"><div class="navin" id="nav"><a href="/" data-cat="all">Home</a><a href="/?category=india" data-cat="india">India</a><a href="/?category=world" data-cat="world">World</a><a href="/?category=politics" data-cat="politics">Politics</a><a href="/?category=business" data-cat="business">Business</a><a href="/?category=technology" data-cat="technology">Tech</a><a href="/?category=sports" data-cat="sports">Sports</a><a href="/?category=entertainment" data-cat="entertainment">Entertainment</a></div></nav><main class="wrap"><section class="hero"><article class="lead" id="lead"><div class="copy"><div class="tag">Latest report</div><h1>Loading latest news…</h1><p>Fetching the latest published update.</p></div></article><aside class="side"><h2>Latest updates</h2><div id="side"></div></aside></section><div class="bar"><input id="search" placeholder="Search news & headlines…"><button class="on" data-filter="all">All</button><button data-filter="politics">Politics</button><button data-filter="india">India</button><button data-filter="world">World</button></div><section><h2 style="font-size:20px">Latest News</h2><div id="news" class="grid"></div></section><footer class="footer">politicshub.in · Live news desk</footer></main><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));const qs=new URLSearchParams(location.search),state={cat:qs.get('category')||'all',search:'',rows:[]};function fmt(x){return x||''}function render(){let rows=state.rows.filter(n=>!state.search||`${n.title} ${n.summary}`.toLowerCase().includes(state.search.toLowerCase()));$('news').innerHTML=rows.length?rows.map(n=>`<a class="card" href="/article.html?id=${encodeURIComponent(n.id)}">${n.image_url?`<img src="${esc(n.image_url)}" alt="" loading="lazy">`:''}<div class="body"><div class="cat">${esc(n.category||'News')}</div><h3>${esc(n.title)}</h3><p>${esc(n.summary||'')}</p><div class="time">${esc(fmt(n.published_at))}</div></div></a>`).join(''):'<div class="empty">No published stories found.</div>'}async function load(){try{const r=await fetch('/api/news?category='+encodeURIComponent(state.cat)+'&limit=60');const d=await r.json();if(!r.ok)throw 0;state.rows=d;document.querySelectorAll('[data-cat]').forEach(a=>a.classList.toggle('active',a.dataset.cat===state.cat));if(d[0]){const n=d[0];$('lead').innerHTML=`${n.image_url?`<img src="${esc(n.image_url)}" alt="">`:''}<div class="copy"><div class="tag">${esc(n.category||'Latest')} · JUST IN</div><h1>${esc(n.title)}</h1><p>${esc(n.summary||'')}</p><div class="time">${esc(n.published_at||'')}</div></div>`}$('side').innerHTML=d.slice(0,6).map(n=>`<a class="story" href="/article.html?id=${encodeURIComponent(n.id)}"><b>${esc(n.title)}</b><span>${esc(n.published_at||'')}</span></a>`).join('');render()}catch(e){$('news').innerHTML='<div class="empty">News service is temporarily unavailable.</div>'}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.filter;load()});$('search').oninput=e=>{state.search=e.target.value;render()};load();setInterval(load,60000);</script></body></html>
