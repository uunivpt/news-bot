<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>PoliticsHub.in — News</title>
<style>
:root{--bg:#08090d;--panel:#10121a;--line:#242733;--text:#f6f7fb;--muted:#9096a5;--accent:#ff4f70;--blue:#7da9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:20;background:#08090de8;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topin{max-width:1280px;margin:auto;height:68px;padding:0 20px;display:flex;align-items:center;gap:22px}.logo{width:155px;height:45px;object-fit:contain;object-position:left}.live{margin-left:auto;color:#aab0bf;font-size:9px;font-weight:900;letter-spacing:.15em}.live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff4566;margin-right:6px}.nav{border-bottom:1px solid var(--line);overflow:auto}.navin{max-width:1280px;margin:auto;display:flex;white-space:nowrap;padding:0 15px}.nav a{padding:12px 9px;color:#7f8594;text-decoration:none;font-size:10px;font-weight:900}.nav a.active,.nav a:hover{color:#fff}.wrap{max-width:1280px;margin:auto;padding:24px 20px 55px}.ticker{display:flex;gap:10px;align-items:center;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:#0e1016;color:#9aa1b0;font-size:10px;overflow:hidden}.ticker b{color:#fff;white-space:nowrap}.ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero{display:grid;grid-template-columns:1.55fr .8fr;gap:14px;margin-top:14px}.lead,.side{border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}.lead{min-height:450px;position:relative}.lead.has-image{background:#111}.lead img{width:100%;height:450px;object-fit:cover;display:block;opacity:.62}.lead.no-image{padding:30px;display:flex;align-items:flex-end;background:linear-gradient(135deg,#17151c,#0d0e13)}.lead.no-image .copy{position:static;max-width:800px}.copy{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:28px;background:linear-gradient(180deg,transparent,#08090df5 72%)}.tag{font-size:9px;color:var(--accent);font-weight:900;letter-spacing:.15em;text-transform:uppercase}.copy h1{font-size:clamp(28px,4.5vw,52px);line-height:1.02;letter-spacing:-1.8px;margin:9px 0}.copy p{font-size:13px;line-height:1.55;color:#c2c6cf;max-width:800px;margin:0}.meta{color:#717887;font-size:9px;margin-top:12px}.side{padding:16px}.side h2{font-size:14px;margin:0 0 10px}.side a{display:block;color:#fff;text-decoration:none;padding:13px 0;border-top:1px solid var(--line)}.side a:first-of-type{border-top:0}.side b{display:block;font-size:12px;line-height:1.35}.side span{display:block;color:#707786;font-size:8px;margin-top:6px}.tools{display:flex;gap:8px;margin:18px 0;position:sticky;top:68px;z-index:10;background:#08090dec;padding:8px;border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(15px)}.tools input{flex:1;min-width:120px;background:#0e1016;border:0;outline:0;color:#fff;padding:9px 10px;border-radius:8px}.tools button{border:1px solid var(--line);background:#11141b;color:#8f96a5;border-radius:8px;padding:8px 10px;font-size:9px;font-weight:900}.tools button.active,.tools button:hover{color:#fff}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin:0 0 10px}.sectionhead h2{font-size:20px;margin:0}.sectionhead span{color:#6f7583;font-size:9px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.card{display:block;text-decoration:none;color:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0e1016;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#414657}.card img{display:block;width:100%;height:170px;object-fit:cover}.body{padding:13px}.cat{font-size:8px;color:#7d8493;text-transform:uppercase;letter-spacing:.12em;font-weight:900}.body h3{font-size:13px;line-height:1.38;margin:7px 0}.body p{font-size:10px;line-height:1.5;color:#9299a8;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.source{font-size:8px;color:#666e7d;margin-top:9px}.source a{color:#aeb6c5}.empty{grid-column:1/-1;padding:45px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:#697181}.footer{border-top:1px solid var(--line);margin-top:40px;padding-top:18px;color:#626977;font-size:9px}@media(max-width:900px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.topin{height:58px;padding:0 12px}.logo{width:140px}.wrap{padding:14px 12px 45px}.nav a{padding:11px 8px}.hero{margin-top:10px}.lead,.lead img{min-height:380px;height:380px}.lead.no-image{min-height:300px}.copy{padding:19px}.copy h1{font-size:29px}.tools{top:58px;flex-wrap:wrap}.tools input{flex-basis:100%}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.card img{height:125px}}@media(max-width:410px){.grid{grid-template-columns:1fr}.card img{height:185px}}
</style></head><body>
<header class="top"><div class="topin"><a href="/"><img class="logo" src="/brand.svg" alt="PoliticsHub.in"></a><span class="live"><i></i>LIVE NEWS DESK</span></div></header>
<nav class="nav"><div class="navin" id="nav"><a href="/" data-cat="all">Home</a><a href="/?category=india" data-cat="india">India</a><a href="/?category=world" data-cat="world">World</a><a href="/?category=politics" data-cat="politics">Politics</a><a href="/?category=business" data-cat="business">Business</a><a href="/?category=technology" data-cat="technology">Tech</a><a href="/?category=sports" data-cat="sports">Sports</a><a href="/?category=entertainment" data-cat="entertainment">Entertainment</a></div></nav>
<main class="wrap"><div class="ticker"><b>LATEST</b><span id="ticker">Loading the latest update…</span></div><section class="hero"><article id="lead" class="lead no-image"><div class="copy"><div class="tag">Latest report</div><h1>Loading latest news…</h1><p>Fetching published updates.</p></div></article><aside class="side"><h2>Latest updates</h2><div id="side"></div></aside></section>
<div class="tools"><input id="search" placeholder="Search news & headlines…"><button data-filter="all" class="active">All</button><button data-filter="politics">Politics</button><button data-filter="india">India</button><button data-filter="world">World</button></div>
<div class="sectionhead"><h2>Latest News</h2><span id="count"></span></div><section id="news" class="grid"></section><footer class="footer">politicshub.in · Source attribution is shown on every published story.</footer></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),q=new URLSearchParams(location.search),state={cat:q.get("category")||"all",search:"",rows:[]};
function source(n){return n.source_name?(n.url?'<div class="source">Source: <a href="'+esc(n.url)+'" target="_blank" rel="noopener noreferrer">'+esc(n.source_name)+'</a></div>':'<div class="source">Source: '+esc(n.source_name)+'</div>'):""}
function card(n){return '<a class="card" href="/article.html?id='+encodeURIComponent(n.id)+'">'+(n.image_url?'<img src="'+esc(n.image_url)+'" alt="" loading="lazy">':"")+'<div class="body"><div class="cat">'+esc(n.category||"News")+'</div><h3>'+esc(n.title)+'</h3><p>'+esc(n.summary||"")+'</p><div class="meta">'+esc(n.published_at||"")+'</div>'+source(n)+'</div></a>'}
function render(){const rows=state.rows.filter(n=>!state.search||((n.title||"")+" "+(n.summary||"")).toLowerCase().includes(state.search.toLowerCase()));$("count").textContent=rows.length+" stories";$("news").innerHTML=rows.length?rows.map(card).join(""):'<div class="empty">No published stories found.</div>'}
async function load(){try{const r=await fetch("/api/news?category="+encodeURIComponent(state.cat)+"&limit=60");const d=await r.json();if(!r.ok)throw Error();state.rows=d;document.querySelectorAll("[data-cat]").forEach(a=>a.classList.toggle("active",a.dataset.cat===state.cat));if(d[0]){const n=d[0],has=!!n.image_url;$("lead").className="lead "+(has?"has-image":"no-image");$("lead").innerHTML=(has?'<img src="'+esc(n.image_url)+'" alt="">':"")+'<div class="copy"><div class="tag">'+esc(n.category||"Latest")+' · JUST IN</div><h1>'+esc(n.title)+'</h1><p>'+esc(n.summary||"")+'</p><div class="meta">'+esc(n.published_at||"")+' · '+esc(n.source_name||"")+'</div></div>'}$("ticker").textContent=d[0]?d[0].title:"No updates";$("side").innerHTML=d.slice(0,7).map(n=>'<a href="/article.html?id='+encodeURIComponent(n.id)+'"><b>'+esc(n.title)+'</b><span>'+esc(n.published_at||"")+' · '+esc(n.source_name||"")+'</span></a>').join("");render()}catch(e){$("news").innerHTML='<div class="empty">News service is temporarily unavailable.</div>'}}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{state.cat=b.dataset.filter;load()});$("search").oninput=e=>{state.search=e.target.value;render()};load();setInterval(load,60000);
</script></body></html>
