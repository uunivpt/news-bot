<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505">
<title>PoliticsHub.in — News</title>
<style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f7f7f8;background:#050505}*{box-sizing:border-box}body{margin:0;background:#050505}.top{background:#08080a;color:#fff;padding:18px 5%;font-weight:900;font-size:22px;border-bottom:1px solid #202025}.wrap{max-width:980px;margin:auto;padding:22px 16px}.article{background:#0b0b0d;border:1px solid #222229;border-radius:20px;padding:clamp(18px,4vw,42px)}.back{color:#cfd0d6;text-decoration:none;font-weight:800;font-size:13px}.hero{width:100%;max-height:560px;object-fit:cover;border-radius:15px;margin:20px 0}.meta{color:#85868e;font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;margin-top:18px}h1{font-size:clamp(30px,5vw,52px);line-height:1.08;letter-spacing:-.04em;margin:12px 0 18px}.text{font-size:clamp(17px,2vw,20px);line-height:1.8;white-space:pre-wrap;color:#e9e9ed}.error{padding:40px;text-align:center;color:#999}@media(max-width:600px){.wrap{padding:10px}.article{border-radius:14px}.hero{margin:14px 0}}
</style></head>
<body><header class="top">politicshub.in</header><main class="wrap"><article class="article" id="a"><div class="error">Loading article…</div></article></main>
<script>
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){a.innerHTML='<div class="error">Article not found</div>';return}try{const r=await fetch('/api/news/'+encodeURIComponent(id));const n=await r.json();if(!r.ok)throw Error();const article=n.ai_article||n.ai_summary||n.summary;if(!article){a.innerHTML='<div class="error">This story is still being prepared.</div>';return}a.innerHTML=`<a class="back" href="/">← Back to politicshub.in</a>${n.image_url?`<img class="hero" src="${esc(n.image_url)}" alt="">`:''}<div class="meta">${esc(n.published_at||'')}</div><h1>${esc(n.title)}</h1><div class="text">${esc(article)}</div>`}catch(e){a.innerHTML='<div class="error">Article not found</div>'}})();
</script></body></html>
