<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NewsDesk — Latest News</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#101828;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.bar{background:#0b1220;color:#fff;padding:18px 5%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:25px}.live{font-size:12px;background:#e11d48;padding:7px 10px;border-radius:999px}.wrap{max-width:1250px;margin:auto;padding:22px 18px}.hero{background:#fff;border-radius:22px;padding:28px;box-shadow:0 8px 30px #0000000b;margin-bottom:20px}.hero h1{font-size:40px;margin:0 0 8px}.muted{color:#667085}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.filters input,.filters select,.filters button{padding:12px 14px;border:1px solid #d0d5dd;border-radius:11px;background:#fff}.filters input{flex:1;min-width:220px}.filters button{cursor:pointer;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 24px #0000000a}.card img{width:100%;height:190px;object-fit:cover;background:#e4e7ec}.body{padding:17px}.meta{font-size:12px;color:#667085;text-transform:uppercase;letter-spacing:.04em}.card h2{font-size:20px;line-height:1.25;margin:8px 0}.card p{color:#475467;line-height:1.55}.card a{color:#175cd3;font-weight:800;text-decoration:none}.ticker{white-space:nowrap;overflow:hidden;background:#fff;border-bottom:1px solid #eaecf0;padding:10px 5%;font-size:13px}.footer{padding:35px 5%;text-align:center;color:#667085}</style></head><body><header class="bar"><div class="brand">NewsDesk</div><div class="live">● LIVE NEWS</div></header><div class="ticker">Source-attributed reporting · India · World · Politics · Business · Technology · Sports · Science</div><main class="wrap"><section class="hero"><h1>Latest News</h1><div class="muted">Fast headlines and summaries with links to the original source.</div><div class="filters"><input id="search" placeholder="Search headlines..."><select id="category"><option value="all">All categories</option><option>india</option><option>world</option><option>politics</option><option>business</option><option>technology</option><option>sports</option><option>entertainment</option><option>science</option><option>health</option></select><button onclick="loadNews()">Search</button></div></section><section id="news" class="grid"></section></main><footer class="footer">NewsDesk · Original sources are credited and linked.</footer><script>const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));async function loadNews(){const q=new URLSearchParams({category:category.value,search:search.value,limit:'60'});const r=await fetch('/api/news?'+q);const d=await r.json();news.innerHTML=d.map(n=>`<article class="card">${n.image_url?`<img src="${esc(n.image_url)}" loading="lazy">`:''}<div class="body"><div class="meta">${esc(n.category)} · ${esc(n.source_name)}</div><h2>${esc(n.title)}</h2><p>${esc(n.ai_summary||n.summary||'')}</p><a href="/article.html?id=${encodeURIComponent(n.id)}">Open article →</a> · <a href="${esc(n.url)}" target="_blank" rel="noopener">Original source</a></div></article>`).join('')||'<div class="hero">No published news yet.</div>'}loadNews();setInterval(loadNews,60000);</script></body></html>
