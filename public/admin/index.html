<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NewsDesk Admin</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#101828;background:#f4f6f8;--nav:#0b1220;--blue:#175cd3;--line:#eaecf0}*{box-sizing:border-box}body{margin:0}.top{background:var(--nav);color:#fff;padding:17px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:23px}.private{font-size:11px;color:#cbd5e1}.box{max-width:1250px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 6px 24px #0000000a}.login{max-width:430px;margin:8vh auto}.login h1{margin-top:0}input,button,select{font:inherit;padding:12px 13px;border:1px solid #ccd2da;border-radius:10px;background:#fff}input{width:100%;margin-bottom:10px}button{cursor:pointer;font-weight:800}.primary{background:var(--nav);color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}.stat{padding:15px;background:#f8fafc;border-radius:12px}.stat b{font-size:22px;display:block}.item{padding:18px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item h3{margin:5px 0;font-size:18px}.meta{font-size:11px;color:#667085;text-transform:uppercase;font-weight:800}.review{background:#fff7e6;padding:10px;border-radius:10px;margin:10px 0;color:#92400e}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.msg{color:#b42318;min-height:20px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.box{padding:10px}.panel{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.actions button{flex:1}.private{display:none}}
</style></head><body><header class="top"><div class="brand">NewsDesk Control Room</div><div class="private">PRIVATE ADMIN</div></header><main class="box"><section id="login" class="panel login"><h1>Admin sign in</h1><p>Private access for authorised NewsDesk admins.</p><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button class="primary" style="width:100%" onclick="doLogin()">Sign in</button><div id="msg" class="msg"></div></section><section id="app" style="display:none"><div class="panel"><div class="toolbar"><button onclick="refresh()">↻ Refresh</button><button onclick="fact()">Fact-check precheck</button><button onclick="logout()">Sign out</button></div><div id="stats" class="stats"></div></div><div class="panel"><div class="toolbar"><input id="filter" style="flex:1;min-width:180px;margin:0" placeholder="Filter queue…" oninput="render()"><select id="status" onchange="refresh()"><option value="all">All statuses</option><option>pending</option><option>review</option><option>approved</option><option>published</option><option>rejected</option></select></div><div id="list" style="margin-top:12px"></div></div></section></main><script>let rows=[];const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));async function doLogin(){msg.textContent='';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});const d=await r.json();if(r.ok){login.style.display='none';app.style.display='block';refresh()}else msg.textContent=d.error||'Login failed'}async function refresh(){const s=await (await fetch('/api/stats')).json();if(s.error){login.style.display='block';app.style.display='none';return}stats.innerHTML=Object.entries(s).map(([k,v])=>`<div class="stat"><span>${esc(k)}</span><b>${v}</b></div>`).join('');const r=await fetch('/api/news?status='+encodeURIComponent(status.value)+'&limit=100');rows=await r.json();render()}function render(){const q=(filter.value||'').toLowerCase();const d=rows.filter(n=>(n.title+' '+n.source_name+' '+n.category).toLowerCase().includes(q));list.innerHTML=d.map(n=>`<div class="item"><div class="meta">${esc(n.category)} · ${esc(n.source_name)} · ${esc(n.status)}</div><h3>${esc(n.title)}</h3><p>${esc(n.summary||n.ai_summary||'')}</p>${n.fact_check_notes?`<div class="review">Review flags: ${esc(n.fact_check_notes)}</div>`:''}<div class="actions"><button onclick="act(${n.id},'approve')">Approve</button><button class="primary" onclick="act(${n.id},'publish')">Publish</button><button onclick="ai(${n.id})">Generate AI article</button><button onclick="act(${n.id},'reject')">Reject</button></div></div>`).join('')||'<p>No matching items.</p>'}async function act(id,a){await fetch('/api/news/'+id+'/'+a,{method:'POST'});refresh()}async function ai(id){const r=await fetch('/api/news/'+id+'/ai',{method:'POST'});alert(r.ok?'AI article generated.':'AI is not configured.');refresh()}async function fact(){await fetch('/api/fact-check',{method:'POST'});refresh()}async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}fetch('/api/admin/me').then(r=>r.json()).then(d=>{if(d.authenticated){login.style.display='none';app.style.display='block';refresh()}})</script></body></html>
