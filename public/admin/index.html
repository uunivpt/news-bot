<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NewsDesk Admin</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#101828}.box{max-width:1100px;margin:30px auto;padding:20px}.panel{background:white;padding:22px;border-radius:18px;margin-bottom:18px;box-shadow:0 5px 25px #0001}input,button,select{padding:11px;margin:5px;border:1px solid #ccd2da;border-radius:9px}button{cursor:pointer;font-weight:700}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:15px 20px;background:#f8fafc;border-radius:12px}.item{border-top:1px solid #eaecf0;padding:16px 0}.review{background:#fff8e1;padding:10px;border-radius:8px}</style></head><body><div class="box"><div id="login" class="panel"><h1>Private Admin</h1><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Sign in</button><p id="msg"></p></div><div id="app" style="display:none"><div class="panel"><h1>NewsDesk Control Room</h1><button onclick="refresh()">Refresh</button><button onclick="logout()">Logout</button><button onclick="fact()">Run fact-check precheck</button><div id="stats" class="stats"></div></div><div class="panel"><h2>Review queue</h2><div id="list"></div></div></div></div><script>async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let d=await r.json();if(r.ok){login.style.display='none';app.style.display='block';refresh()}else msg.textContent=d.error||'Login failed'}async function refresh(){let s=await (await fetch('/api/stats')).json();stats.innerHTML=Object.entries(s).map(([k,v])=>`<div class="stat"><b>${k}</b><br>${v}</div>`).join('');let d=await (await fetch('/api/news?status=all&limit=100')).json();list.innerHTML=d.map(n=>`<div class="item"><b>${esc(n.title)}</b><div>${esc(n.source_name)} · ${esc(n.category)} · <b>${esc(n.status)}</b></div>${n.fact_check_notes?`<div class="review">Flags: ${esc(n.fact_check_notes)}</div>`:''}<p>${esc(n.summary||'')}</p><button onclick="act(${n.id},'approve')">Approve</button><button onclick="act(${n.id},'publish')">Publish</button><button onclick="act(${n.id},'reject')">Reject</button><button onclick="ai(${n.id})">AI article</button></div>`).join('')}async function act(id,a){await fetch('/api/news/'+id+'/'+a,{method:'POST'});refresh()}async function ai(id){let r=await fetch('/api/news/'+id+'/ai',{method:'POST'});alert(r.ok?'AI article generated':'AI is not configured');refresh()}async function fact(){await fetch('/api/fact-check',{method:'POST'});refresh()}async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));</script></body></html>
