name: Nana Patekar One-Time Memorial Reel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nana-tribute-direct.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nana-patekar-tribute-direct-20261008
  cancel-in-progress: false

jobs:
  publish-memorial:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install media utilities
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Chrome for Remotion
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Remotion
        run: npm install --prefix reel --omit=dev --no-audit --no-fund
      - name: Check Meta and Cloudinary credentials are configured
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          for name in META_ACCESS_TOKEN META_INSTAGRAM_ACCOUNT_ID CLOUDINARY_CLOUD_NAME CLOUDINARY_UPLOAD_PRESET; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
      - name: Render and publish original PoliticsHub memorial Reel
        env:
          PYTHONPATH: .
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          META_API_VERSION: ${{ secrets.META_API_VERSION }}
          META_API_BASE_URL: ${{ secrets.META_API_BASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          REMOTION_RENDER_TIMEOUT: "1200"
          RENDER_CONCURRENCY: "2"
        run: python scripts/publish_nana_reel_direct.py
      - name: Save confirmed Meta publication receipt to production branch
        run: |
          test -s public/nana-tribute-published.json
          git config user.name "PoliticsHub Reel Bot"
          git config user.email "politicshub-bot@users.noreply.github.com"
          git add public/nana-tribute-published.json
          if git diff --cached --quiet; then
            echo "Receipt already committed."
            exit 0
          fi
          git commit -m "Record confirmed Nana Patekar Instagram media ID [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
