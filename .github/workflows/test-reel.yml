name: Test 18s Reel

on:
  workflow_dispatch:

jobs:
  test-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Build and verify 18-second reel
        env:
          FIXED_AUDIO_URL: ${{ secrets.FIXED_AUDIO_URL }}
        run: python scripts/test_reel.py
      - name: Upload test reel
        uses: actions/upload-artifact@v4
        with:
          name: news-pulse-18s-test
          path: data/test_reel/news_pulse_test_18s.mp4
          if-no-files-found: error
