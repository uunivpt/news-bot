name: Emergency Public News Feed (No Database)

on:
  schedule:
    # The regular collector already publishes this fallback on quota failure.
    # Keep an independent recovery path without duplicating every collection.
    - cron: "11 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/offline_snapshot.py"
      - "public/mobile-reviewed.json"
      - "config/sources.json"
      - "app/rss.py"
      - "app/news_api.py"
      - ".github/workflows/offline-feed.yml"

concurrency:
  group: emergency-public-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install feed dependencies
        run: pip install -r requirements.txt
      - name: Update safe public source snapshot
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: PYTHONPATH=. python scripts/offline_snapshot.py
      - name: Coalesce emergency feed releases
        id: feed_release
        env:
          PYTHONPATH: .
        run: python scripts/feed_release_gate.py --channel news
      - name: Publish snapshot when its hourly gate opens
        if: steps.feed_release.outputs.publish == 'true'
        run: |
          git config user.name "politicshub-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news-data.json app/data/public-archive.json.gz .github/feed-release-state/news.json
          git commit -m "Refresh PoliticsHub public news snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
