name: Test 18s Reel

on:
  workflow_dispatch:
  push:
    paths:
      - "app/html_reel_renderer.py"
      - "app/templates/politicshub_reel_18s.html"
      - "app/instagram_reel.py"
      - ".github/workflows/test_reel.yml"

jobs:
  test:
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium xvfb
          ffmpeg -version | head -n 1
          chromium --version
      - run: pip install -r requirements.txt

      - name: Validate changed Python syntax
        run: |
          python -m py_compile app/database.py
          python -m py_compile app/worker.py
          python -m py_compile app/html_reel_renderer.py
          python -m py_compile scripts/auto_publish.py

      - name: Test database
        env:
          PYTHONPATH: .
          DATABASE_URL: ''
          PGSSLMODE: ''
        run: python -m unittest tests/test_database.py -v

      - name: Test newsroom
        env:
          PYTHONPATH: .
          DATABASE_URL: ''
          PGSSLMODE: ''
        run: python -m unittest tests/test_newsroom.py -v

      - name: Test normalize
        env:
          PYTHONPATH: .
          DATABASE_URL: ''
          PGSSLMODE: ''
        run: python -m unittest tests/test_normalize.py -v

      - name: Test website monitor
        env:
          PYTHONPATH: .
          DATABASE_URL: ''
          PGSSLMODE: ''
        run: python -m unittest tests/test_website_monitor.py -v

      - name: Test advanced system
        env:
          PYTHONPATH: .
          DATABASE_URL: ''
          PGSSLMODE: ''
        run: python tests/test_advanced_system.py -v

      - name: Render current HTML Reel without image
        env:
          PYTHONPATH: .
        run: |
          mkdir -p data/media
          set +e
          python - <<'PY' >data/media/html_render.log 2>&1
          from app.html_reel_renderer import render_html_reel
          render_html_reel({
              "headline": "A deliberately long PoliticsHub headline that must remain readable without being cut off",
              "category": "WORLD",
              "date": "03 Oct 2026",
              "location": "Donetsk, Ukraine",
              "source": "PoliticsHub",
              "summary": "This verifies the production HTML template, dynamic text fields, no-image path and exact duration.",
              "image_url": None,
          }, "data/media/test_html_no_image.mp4")
          PY
          rc=$?
          if [ "$rc" -ne 0 ]; then
            msg=$(tail -n 5 data/media/html_render.log | tr '\n' ' ' | cut -c1-140)
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=ci-render-diagnostic -f description="$msg" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
            encoded=$(base64 -w0 data/media/html_render.log)
            curl -fsS -X PUT -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci-render-error-${GITHUB_RUN_ID}.txt" -d "{\"message\":\"Record HTML renderer CI failure\",\"content\":\"$encoded\",\"branch\":\"main\"}" || true
            cat data/media/html_render.log
            exit "$rc"
          fi

      - name: Verify HTML Reel duration
        run: |
          test -s data/media/test_html_no_image.mp4
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 data/media/test_html_no_image.mp4)
          python - "$DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          if abs(d-18.0)>0.15:
              raise SystemExit(f"HTML Reel is not 18 seconds: {d}")
          print("HTML 18-second duration check: PASS")
          PY

      - name: Download fixed audio and build test image
        env:
          FIXED_AUDIO_URL: ${{ secrets.FIXED_AUDIO_URL }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import requests
          from PIL import Image, ImageDraw, ImageFont

          url = os.environ.get("FIXED_AUDIO_URL", "").strip()
          if not url.startswith(("https://", "http://")):
              raise SystemExit("FIXED_AUDIO_URL is not a valid HTTP(S) URL. Re-copy the Cloudinary Secure URL into the GitHub secret.")

          out = Path("data/media")
          out.mkdir(parents=True, exist_ok=True)
          r = requests.get(url, timeout=30)
          r.raise_for_status()
          audio = out / "fixed_music.mp3"
          audio.write_bytes(r.content)
          print(f"Audio download OK: {len(r.content)} bytes")

          img = Image.new("RGB", (1080, 1920), "white")
          d = ImageDraw.Draw(img)
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 64)
          except Exception:
              font = ImageFont.load_default()
          d.text((70, 800), "NEWS REEL TEST", fill="black", font=font)
          d.text((70, 900), "18 seconds • fixed audio", fill="black", font=font)
          img.save(out / "test.jpg", quality=92)
          PY

      - name: Build exact 18-second Reel
        run: |
          python - <<'PY'
          from app.instagram_reel import build_reel
          build_reel(["data/media/test.jpg"], "data/media/test_18s.mp4", "data/media/fixed_music.mp3", 18)
          PY
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 data/media/test_18s.mp4)
          echo "Reel duration: ${DURATION}s"
          python - "$DURATION" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if abs(duration - 18.0) > 0.15:
              raise SystemExit(f"Reel is not 18 seconds: {duration}")
          print("18-second duration check: PASS")
          PY

      - name: Upload test Reel to Cloudinary (no Instagram publish)
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          python - <<'PY'
          import os
          from app.cloudinary_storage import upload_video
          url = upload_video("data/media/test_18s.mp4")
          if not url:
              raise SystemExit("Cloudinary upload was not configured")
          print("Cloudinary video upload: PASS")
          print("Public video URL was returned successfully (not printing the URL).")
          PY

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-pulse-18s-test
          path: data/media/test_18s.mp4
          retention-days: 3
