name: Production Reel Regression

on:
  workflow_dispatch:
  push:
    paths:
      - "reel/**"
      - "app/remotion_reel_renderer.py"
      - "scripts/auto_publish.py"
      - "app/image_acquisition.py"
      - "app/news_pulse_audio.py"
      - "tests/test_remotion_reel_renderer.py"
      - ".github/workflows/test_reel.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Remotion dependencies
        run: npm install --prefix reel --no-audit --no-fund

      - name: Validate Python and Remotion
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile app/remotion_reel_renderer.py scripts/auto_publish.py
          python -m unittest tests/test_remotion_reel_renderer.py -v
          npm --prefix reel run check
          npm --prefix reel test

      - name: Run core regression tests
        env:
          PYTHONPATH: .
          DATABASE_URL: ""
          PGSSLMODE: ""
        run: |
          python -m unittest tests/test_api_public_title.py -v
          python -m unittest tests/test_source_config.py -v
          python -m unittest tests/test_database.py -v
          python -m unittest tests/test_newsroom.py -v
          python -m unittest tests/test_normalize.py -v
          python -m unittest tests/test_website_monitor.py -v
          python tests/test_advanced_system.py -v

      - name: Build production 18-second Remotion Reel
        env:
          PYTHONPATH: .
        run: |
          mkdir -p data/media
          python - <<'PY'
          from app.remotion_reel_renderer import render_remotion_reel
          render_remotion_reel(
              {
                  "headline": "A deliberately long PoliticsHub headline that must remain readable without being cut off",
                  "category": "WORLD",
                  "date": "07 Oct 2026",
                  "location": "NEWS DESK",
                  "source": "PoliticsHub",
                  "summary": "This verifies the production Remotion template, dynamic text fields, no-image fallback and exact eighteen-second duration.",
                  "image_url": None,
              },
              "data/media/test_remotion_no_image.mp4",
          )
          PY

      - name: Verify final Reel
        run: |
          test -s data/media/test_remotion_no_image.mp4
          python - <<'PY'
          import json, subprocess
          path = "data/media/test_remotion_no_image.mp4"
          raw = subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration:stream=width,height,pix_fmt,r_frame_rate",
              "-of", "json", path
          ])
          info = json.loads(raw)
          duration = float(info["format"]["duration"])
          video = next(s for s in info["streams"] if s.get("width"))
          print(json.dumps(info, indent=2))
          assert 17.75 <= duration <= 18.75, duration
          assert (video["width"], video["height"]) == (1080, 1920)
          assert video["pix_fmt"] in {"yuv420p", "yuvj420p"}, video["pix_fmt"]
          assert video["r_frame_rate"] in {"30/1", "60/2"}, video["r_frame_rate"]
          print(f"PASS: {duration:.3f}s / 1080x1920 / 30fps / {video['pix_fmt']}")
          PY

      - name: Upload Reel test artifact
        uses: actions/upload-artifact@v4
        with:
          name: politicshub-18s-remotion-reel-test
          path: data/media/test_remotion_no_image.mp4
          retention-days: 3
