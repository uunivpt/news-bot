name: Test 18s Reel

on:
  workflow_dispatch:
  push:
    paths:
      - "app/html_reel_renderer.py"
      - "app/templates/politicshub_reel_18s.html"
      - "app/instagram_reel.py"
      - "scripts/auto_publish.py"
      - ".github/workflows/test_reel.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium
          chromium --version
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate changed Python syntax
        run: |
          python -m py_compile app/database.py
          python -m py_compile app/worker.py
          python -m py_compile app/html_reel_renderer.py
          python -m py_compile app/instagram_reel.py
          python -m py_compile scripts/auto_publish.py

      - name: Test database
        env:
          PYTHONPATH: .
          DATABASE_URL: ""
          PGSSLMODE: ""
        run: python -m unittest tests/test_database.py -v

      - name: Test newsroom
        env:
          PYTHONPATH: .
          DATABASE_URL: ""
          PGSSLMODE: ""
        run: python -m unittest tests/test_newsroom.py -v

      - name: Test normalize
        env:
          PYTHONPATH: .
          DATABASE_URL: ""
          PGSSLMODE: ""
        run: python -m unittest tests/test_normalize.py -v

      - name: Test website monitor
        env:
          PYTHONPATH: .
          DATABASE_URL: ""
          PGSSLMODE: ""
        run: python -m unittest tests/test_website_monitor.py -v

      - name: Test advanced system
        env:
          PYTHONPATH: .
          DATABASE_URL: ""
          PGSSLMODE: ""
        run: python tests/test_advanced_system.py -v

      - name: Build current 18-second HTML Reel
        env:
          PYTHONPATH: .
        run: |
          mkdir -p data/media
          python - <<'PY'
          from app.html_reel_renderer import render_html_reel

          render_html_reel(
              {
                  "headline": "A deliberately long PoliticsHub headline that must remain readable without being cut off",
                  "category": "WORLD",
                  "date": "03 Oct 2026",
                  "location": "Donetsk, Ukraine",
                  "source": "PoliticsHub",
                  "summary": "This verifies the current production HTML template, dynamic text fields, no-image path and exact duration.",
                  "image_url": None,
              },
              "data/media/test_html_no_image.mp4",
          )
          PY

      - name: Verify final Reel
        run: |
          test -s data/media/test_html_no_image.mp4
          ffprobe -v error             -show_entries format=duration             -of default=noprint_wrappers=1:nokey=1             data/media/test_html_no_image.mp4

          python - <<'PY'
          import json
          import subprocess

          path = "data/media/test_html_no_image.mp4"
          raw = subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration:stream=width,height,pix_fmt",
              "-of", "json", path
          ])
          info = json.loads(raw)
          duration = float(info["format"]["duration"])
          video = next(s for s in info["streams"] if s.get("width"))

          assert abs(duration - 18.0) <= 0.15, duration
          assert (video["width"], video["height"]) == (1080, 1920)
          assert video["pix_fmt"] in {"yuv420p", "yuvj420p"}
          print(f"PASS: {duration:.3f}s / 1080x1920 / {video['pix_fmt']}")
          PY

      - name: Upload Reel test artifact
        uses: actions/upload-artifact@v4
        with:
          name: politicshub-18s-reel-test
          path: data/media/test_html_no_image.mp4
          retention-days: 3
