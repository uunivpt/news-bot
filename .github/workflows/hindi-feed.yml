name: Hindi News Hourly

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hindi-feed.yml"
      - "scripts/build_hindi_feed.py"
      - "config/sources.json"

permissions:
  contents: write

concurrency:
  group: hindi-news-hourly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install RSS dependencies
        run: python -m pip install -r requirements.txt
      - name: Build current Hindi publisher-link feed
        env:
          PYTHONPATH: .
        run: python scripts/build_hindi_feed.py
      - name: Coalesce Hindi feed releases
        id: feed_release
        env:
          PYTHONPATH: .
        run: python scripts/feed_release_gate.py --channel hindi
      - name: Publish changed Hindi stories when its hourly gate opens
        if: steps.feed_release.outputs.publish == 'true'
        run: |
          git config user.name "politicshub-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hindi-news.json .github/feed-release-state/hindi.json
          git commit -m "Refresh Hindi headline feed"
          git pull --rebase origin main
          git push origin HEAD:main
