name: Public News Delivery Health (No Neon)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public website without database credentials
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 15 https://www.politicshub.in/api/news?limit=1 >/dev/null
          curl --fail --silent --show-error --max-time 15 https://www.politicshub.in/api/health >/dev/null
