name: Public News Delivery Health (No Neon)

on:
  workflow_dispatch:
  schedule:
    # Phase 4: public feed incident detection every two hours, independent of Termux.
    - cron: "17 */2 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # Failing this scheduled check records a GitHub Actions failure/notification.
      # No public GitHub issue is created and no private phone credentials are used.
      - name: Check public feed, editorial privacy, Politics counters and article URLs
        run: PYTHONPATH=. python scripts/check_public_reliability.py
