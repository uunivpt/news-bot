name: Pipeline tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test pipeline without production credentials
        env:
          DATABASE_URL: ''
          PGSSLMODE: ''
          PHI4_ENABLED: 'false'
        run: |
          python -m compileall -q app api scripts run.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check public/assets/site.js
          node --check public/assets/story-page.js
          node --check public/assets/status.js
          node --test tests/frontend.test.cjs
          node --test reel/scripts/layout.test.mjs
