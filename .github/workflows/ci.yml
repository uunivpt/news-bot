name: Pipeline tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: politicshub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Check homepage CSS bundle matches its sources
        run: python scripts/build_home_css.py --check
      - run: pip install -r requirements.txt
      - name: Test pipeline without production credentials
        env:
          DATABASE_3URL: ''
          DATABASE_URL: ''
          PGSSLMODE: ''
          PHI4_ENABLED: 'false'
          TEST_POSTGRES_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/politicshub_test?sslmode=disable'
        run: |
          python -m compileall -q app api scripts run.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          for file in public/assets/*.js public/admin.js public/service-worker.js; do
            node --check "$file"
          done
          node --test tests/*.test.cjs
      - name: Install browser test tools
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Check responsive UI and reader flows with isolated fixtures
        run: python scripts/browser_audit.py --serve-fixture --base-url http://127.0.0.1:8010 --output artifacts/browser
      - name: Check reading dashboard, motion and keyboard interactions
        run: python scripts/newsroom_ui_browser_audit.py --output artifacts/newsroom-ui
      - name: Check article data charts, accessibility and source values
        run: python scripts/article_data_browser_audit.py --output artifacts/article-data
      - name: Check hosted Admin Room sessions and private diagnostics
        run: python scripts/hosted_admin_browser_audit.py --output artifacts/hosted-admin
      - name: Check public data desk and homepage indicators
        run: python scripts/data_desk_browser_audit.py --output artifacts/data-desk
      - name: Check owner and database-outage Admin Room flows
        run: python scripts/admin_browser_audit.py --output artifacts/admin-browser

      - name: Check events, Marathi studio, evidence, updates and staff scopes
        run: python scripts/editorial_browser_audit.py --output artifacts/editorial-browser

      - name: Check immediate website publication through signed phone bridge
        run: python scripts/instant_publish_browser_audit.py --output artifacts/instant-publish-browser
