name: Public API sanitize once

on:
  push:
    branches: [main]

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[public-api-sanitize]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch public API response
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('api/index.py'); s=p.read_text()
          old='def rows_json(rows):return [dict(r) for r in rows]'
          new='''def _publicize(row):
              r=dict(row)
              if not admin_ok():
                  for key in ("source_name","source_type","url","normalized_url","external_id","url_hash","title_hash","collected_at","fact_check_status","fact_check_notes","approved_at","instagram_status","instagram_media_id","instagram_error","instagram_published_at","instagram_attempts","instagram_last_attempt_at","instagram_next_retry_at","instagram_container_id","reel_cloudinary_public_id","instagram_selected"):
                      r.pop(key,None)
                  raw=r.get("published_at_site") or r.get("published_at")
                  if raw:
                      try:
                          dt=datetime.fromisoformat(str(raw).replace("Z","+00:00")); dt=dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc); dt=dt.astimezone(ZoneInfo("Asia/Kolkata")); r["published_at"]=dt.strftime("%d %b %Y · %H:%M")
                      except ValueError: pass
                  r.pop("published_at_site",None)
              return r
          def rows_json(rows):return [_publicize(r) for r in rows]'''
          if old not in s: raise SystemExit('rows_json target missing')
          s=s.replace(old,new,1)
          old2='return jsonify(row)\n    finally:database.close()\n@app.get("/api/stats")'
          new2='return jsonify(_publicize(row))\n    finally:database.close()\n@app.get("/api/stats")'
          if old2 not in s: raise SystemExit('article return target missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Verify API syntax
        run: python -m py_compile api/index.py
      - name: Commit API patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/index.py .github/workflows/public-api-sanitize-once.yml
          git commit -m 'Hide source metadata from public news API [public-api-sanitize]'
          git push
