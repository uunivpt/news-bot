name: Instagram Reel Worker (Production)

on:
  schedule:
    # Stagger away from the top of the hour because GitHub can delay/drop
    # scheduled jobs during high scheduler load.
    - cron: "4-59/5 * * * *"
  workflow_run:
    workflows: ["News Processing (Production)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/instagram-publisher.yml"

concurrency:
  group: instagram-reel-worker-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache Remotion dependencies
        id: reel-cache
        uses: actions/cache@v4
        with:
          path: reel/node_modules
          key: reel-node-${{ runner.os }}-${{ hashFiles('reel/package.json') }}
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Remotion dependencies
        if: steps.reel-cache.outputs.cache-hit != 'true'
        run: npm install --prefix reel --omit=dev --no-audit --no-fund
      - name: Verify Instagram configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          missing=()
          for name in DATABASE_URL META_ACCESS_TOKEN META_INSTAGRAM_ACCOUNT_ID CLOUDINARY_CLOUD_NAME CLOUDINARY_UPLOAD_PRESET; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing Instagram secrets: ${missing[*]}"
            exit 1
          fi
      - name: Release verified Nana Patekar tribute to website and priority Instagram queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: .
        run: python scripts/publish_nana_tribute_once.py
      - name: Publish Instagram queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PHI4_ENABLED: ${{ secrets.PHI4_ENABLED }}
          PHI4_API_KEY: ${{ secrets.PHI4_API_KEY }}
          PHI4_ENDPOINT: ${{ secrets.PHI4_ENDPOINT }}
          PHI4_MODEL: ${{ secrets.PHI4_MODEL }}
          PHI4_TIMEOUT_SECONDS: ${{ secrets.PHI4_TIMEOUT_SECONDS }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          META_API_VERSION: ${{ secrets.META_API_VERSION }}
          META_API_BASE_URL: ${{ secrets.META_API_BASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          FIXED_AUDIO_PATH: ${{ secrets.FIXED_AUDIO_PATH }}
          FIXED_AUDIO_URL: ${{ secrets.FIXED_AUDIO_URL }}
          REMOTION_RENDER_TIMEOUT: "900"
          RENDER_CONCURRENCY: "2"
          PUBLISH_WEBSITE: "false"
          PUBLISH_TO_INSTAGRAM: "true"
          MAX_ITEMS: "10"
          BOT_REPAIR_ITEMS: "0"
          INSTAGRAM_NEW_ITEMS: "1000"
          INSTAGRAM_RETRY_ITEMS: "1000"
          INSTAGRAM_MAX_PER_RUN: "2"
        run: python scripts/auto_publish.py
