name: News Processing

permissions:
  contents: write

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'config/sources.json'
      - 'scripts/auto_publish.py'
      - 'run.py'
      - '.github/workflows/process.yml'

concurrency:
  group: news-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Validate Python syntax
        env:
          PYTHONPATH: .
        run: python -m compileall -q app api scripts run.py
      - name: Test deterministic newsroom bot
        env:
          PYTHONPATH: .
          DATABASE_URL: ''
          PGSSLMODE: ''
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify production database configuration
        run: |
          test -n "$DATABASE_URL" || { echo "ERROR: GitHub Actions secret DATABASE_URL is missing."; exit 1; }
          echo "Production database secret is configured."
      - name: Verify production database identity and current row count
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          import psycopg
          url = os.environ.get("DATABASE_URL", "")
          if not url:
              raise SystemExit("DATABASE_URL is empty")
          p = urlsplit(url)
          host = p.hostname or ""
          db = (p.path or "").lstrip("/")
          print(f"DB target: host={host} db={db} port={p.port or 5432}")
          with psycopg.connect(url, sslmode="require", connect_timeout=15) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT current_database(), current_user, inet_server_addr()")
                  print("DB identity:", cur.fetchone())
                  cur.execute("SELECT COUNT(*) FROM news_items")
                  print("news_items before collection:", cur.fetchone()[0])
          PY
      - name: Collect fresh news from configured sources
        env:
          PYTHONPATH: .
        run: python run.py --once --config config/sources.json
      - name: Repair legacy published stories with deterministic bot
        env:
          BOT_REPAIR_BATCH: '5000'
        run: python scripts/repair_bot_content.py
      - name: Export public news snapshot for Render
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app.database import NewsDatabase
          db = NewsDatabase()
          try:
              rows = [dict(r) for r in db.latest(100, status="published")]
          finally:
              db.close()
          # Keep the browser snapshot small, but generate the sitemap from the
          # complete published archive so old stories remain discoverable.
          sitemap_db = NewsDatabase()
          try:
              sitemap_rows = [dict(r) for r in sitemap_db.conn.execute(
                  "SELECT id,title,category,published_at_site,published_at FROM news_items WHERE status='published' ORDER BY COALESCE(published_at_site,published_at) DESC,id DESC"
              ).fetchall()]
          finally:
              sitemap_db.close()
          public = []
          for row in rows:
              if not row.get("bot_article"):
                  continue
              public.append({
                  "id": row.get("id"),
                  "source_name": row.get("source_name"),
                  "source_type": row.get("source_type"),
                  "title": row.get("title"),
                  "url": row.get("url"),
                  "published_at": row.get("published_at"),
                  "summary": row.get("summary") or "",
                  "bot_summary": row.get("bot_summary") or row.get("summary") or "",
                  "bot_article": row.get("bot_article") or "",
                  "category": row.get("category") or "general",
                  "image_url": row.get("image_url"),
                  "public_source": bool(row.get("public_source")),
                  "published_at_site": row.get("published_at_site") or row.get("published_at"),
              })
          path = Path("public/news-data.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(public, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          import re
          SITE = "https://www.politicshub.in"
          def esc_xml(value):
              return (str(value or "").replace("&","&amp;").replace("<","&lt;").replace(">","&gt;").replace('"',"&quot;").replace("'","&apos;"))
          def slug(value):
              return re.sub(r"[^a-z0-9]+","-",str(value or "").lower()).strip("-")[:110] or "story"
          def section(value):
              value=str(value or "general").lower()
              return "india" if value=="general" else (value if value in {"india","world","politics","business","technology","sports","entertainment","science","health","hindi"} else "india")
          static_urls=["/","/about.html","/contact.html","/editorial-policy.html","/corrections.html","/privacy.html","/cookies.html","/terms.html","/disclaimer.html","/newsletter.html"]
          Path("public/static-sitemap.xml").write_text(
              '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'+''.join("<url><loc>"+esc_xml(SITE+p)+"</loc></url>" for p in static_urls)+"</urlset>",encoding="utf-8")
          sitemap_urls=[]
          for row in sitemap_rows:
              if not row.get("id") or not row.get("title"): continue
              sitemap_urls.append("<url><loc>"+esc_xml(SITE+"/"+section(row.get("category"))+"/"+str(int(row["id"]))+"-"+slug(row.get("title")))+"</loc></url>")
          import glob
          for old_sitemap in glob.glob("public/news-sitemap-*.xml"):
              Path(old_sitemap).unlink()
          chunk_size=45000
          chunks=[sitemap_urls[i:i+chunk_size] for i in range(0,len(sitemap_urls),chunk_size)] or [[]]
          if len(chunks)==1:
              Path("public/news-sitemap.xml").write_text(
                  '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'+''.join(chunks[0])+"</urlset>",encoding="utf-8")
          else:
              refs=[]
              for index,chunk in enumerate(chunks,1):
                  filename=f"public/news-sitemap-{index}.xml"
                  Path(filename).write_text(
                      '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'+''.join(chunk)+"</urlset>",encoding="utf-8")
                  refs.append("<sitemap><loc>"+esc_xml(SITE+f"/news-sitemap-{index}.xml")+"</loc></sitemap>")
              Path("public/news-sitemap.xml").write_text(
                  '<?xml version="1.0" encoding="UTF-8"?><sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'+''.join(refs)+"</sitemapindex>",encoding="utf-8")
          Path("public/sitemap.xml").write_text(
              '<?xml version="1.0" encoding="UTF-8"?><sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><sitemap><loc>'+SITE+'/static-sitemap.xml</loc></sitemap><sitemap><loc>'+SITE+'/news-sitemap.xml</loc></sitemap></sitemapindex>',encoding="utf-8")
          print(f"Published archive sitemap URLs: {len(sitemap_urls)}")
          print(f"Public snapshot rows: {len(public)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news-data.json
          if git diff --cached --quiet; then
            echo "Public snapshot unchanged."
          else
            git commit -m "chore: refresh public news snapshot [skip ci]"
            # Another workflow/manual commit can land on main while this job is
            # building the snapshot. Rebase our generated commit onto the latest
            # main before pushing, and retry a few times instead of failing the
            # entire news-processing run on a harmless fast-forward race.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Snapshot push raced with another main commit; rebasing (attempt $attempt/3)."
              git fetch origin main
              git rebase origin/main
            done
            if [ "$pushed" != "true" ]; then
              echo "ERROR: Could not push public snapshot after 3 retries."
              exit 1
            fi
          fi
      - name: Publish website, process news and Instagram queue
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          META_API_VERSION: ${{ secrets.META_API_VERSION }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          FIXED_AUDIO_PATH: ${{ secrets.FIXED_AUDIO_PATH }}
          FIXED_AUDIO_URL: ${{ secrets.FIXED_AUDIO_URL }}
          PUBLISH_WEBSITE: 'true'
          PUBLISH_TO_INSTAGRAM: 'false'
          MAX_ITEMS: '15'
          BOT_REPAIR_ITEMS: '10'
          INSTAGRAM_NEW_ITEMS: '20'
          INSTAGRAM_RETRY_ITEMS: '10'
        run: python scripts/auto_publish.py
