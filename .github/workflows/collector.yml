name: News Collector

on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collector.yml"
      - "config/sources.json"

concurrency:
  group: news-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify Neon production database target
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = urlsplit(os.environ.get("DATABASE_URL") or "")
          allowed_hosts = {
              "ep-steep-rice-b5dvvhhb-pooler.c-7.us-east-2.aws.neon.tech",
              "ep-steep-rice-b5dvvhhb.c-7.us-east-2.aws.neon.tech",
          }
          if url.scheme not in {"postgres", "postgresql"} or url.hostname not in allowed_hosts:
              raise SystemExit("DATABASE_URL does not target the new PoliticsHub Neon project. Update the GitHub Actions secret.")
          print("Database target verified (connection credentials concealed).")
          PY
      - name: Run collector once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL is missing; refusing to collect into ephemeral SQLite."; exit 1; }
          python run.py --once
