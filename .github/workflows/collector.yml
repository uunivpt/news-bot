name: News Collector

# GitHub's public source feeds are independent of Neon. The private writable
# PostgreSQL database and editorial approvals live on the Termux phone.
on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collector.yml"
      - "config/sources.json"
      - "scripts/offline_snapshot.py"

concurrency:
  group: emergency-public-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install source dependencies
        run: pip install -r requirements.txt
      - name: Refresh attributed publisher RSS and other configured public sources
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: PYTHONPATH=. python scripts/offline_snapshot.py
      - name: Coalesce feed updates
        id: feed_release
        env:
          PYTHONPATH: .
        run: python scripts/feed_release_gate.py --channel news
      - name: Publish an eligible update without accessing Neon
        if: steps.feed_release.outputs.publish == 'true'
        run: |
          git config user.name "politicshub-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news-data.json app/data/public-archive.json.gz .github/feed-release-state/news.json
          git diff --staged --quiet && exit 0
          git commit -m "Refresh PoliticsHub public news snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
