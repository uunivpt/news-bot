name: News Collector

on:
  schedule:
    # Collect every 30 minutes; the shared feed gate publishes at most hourly.
    - cron: "12,42 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collector.yml"
      - "config/sources.json"

concurrency:
  group: emergency-public-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify Neon production database target
        env:
          DATABASE_3URL: ${{ secrets.DATABASE_3URL }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = urlsplit(os.environ.get("DATABASE_3URL") or "")
          allowed_hosts = {
              "ep-bold-recipe-b5iqrmwg-pooler.c-7.us-east-2.aws.neon.tech",
              "ep-bold-recipe-b5iqrmwg.c-7.us-east-2.aws.neon.tech",
          }
          if url.scheme not in {"postgres", "postgresql"} or url.hostname not in allowed_hosts:
              raise SystemExit("DATABASE_3URL must target politics 3 (shy-mountain-59394437). Update the GitHub Actions secret.")
          print("Database target verified (connection credentials concealed).")
          PY
      - name: Run collector once
        id: collection
        env:
          DATABASE_3URL: ${{ secrets.DATABASE_3URL }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
        run: |
          test -n "$DATABASE_3URL" || { echo "::error::DATABASE_3URL is missing; refusing to collect into ephemeral SQLite."; exit 1; }
          set +e
          python run.py --once
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 78 ]; then
            echo "mode=offline" >> "$GITHUB_OUTPUT"
            echo "::warning::Neon transfer quota exhausted. Publishing source-attributed emergency snapshot instead."
          elif [ "$exit_code" -ne 0 ]; then
            exit "$exit_code"
          else
            echo "mode=database" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh emergency feed while database is quota-blocked
        if: steps.collection.outputs.mode == 'offline'
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: |
          PYTHONPATH=. python scripts/offline_snapshot.py
      - name: Coalesce emergency feed releases
        if: steps.collection.outputs.mode == 'offline'
        id: feed_release
        env:
          PYTHONPATH: .
        run: python scripts/feed_release_gate.py --channel news
      - name: Publish emergency feed when its hourly gate opens
        if: steps.feed_release.outputs.publish == 'true'
        run: |
          git config user.name "politicshub-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news-data.json app/data/public-archive.json.gz .github/feed-release-state/news.json
          git commit -m "Refresh PoliticsHub public news snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
