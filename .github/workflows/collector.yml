name: News Collector

on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:

concurrency:
  group: news-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run collector once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL is missing; refusing to collect into ephemeral SQLite."; exit 1; }
          python run.py --once
