name: Instagram Reel Worker

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: instagram-reel-worker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg chromium
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Verify Instagram worker configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          missing=()
          for name in DATABASE_URL META_ACCESS_TOKEN META_INSTAGRAM_ACCOUNT_ID CLOUDINARY_CLOUD_NAME CLOUDINARY_UPLOAD_PRESET; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing Instagram worker secrets: ${missing[*]}"
            echo "Add them under GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Instagram worker core configuration is present."

      - name: Smoke test current HTML Reel renderer
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.html_reel_renderer import render_html_reel
          out = Path("data/media/html_renderer_smoke.mp4")
          out.parent.mkdir(parents=True, exist_ok=True)
          render_html_reel({
              "headline": "PoliticsHub HTML renderer smoke test with a deliberately long headline",
              "category": "WORLD",
              "date": "03 Oct 2026",
              "location": "Test Location",
              "source": "PoliticsHub",
              "summary": "Renderer verification before any Instagram publish.",
              "image_url": None,
          }, str(out))
          print(f"HTML renderer PASS: {out}")
          PY
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprappers=1:nokey=1 data/media/html_renderer_smoke.mp4)
          python - "$DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          if abs(d-18.0)>0.15:
              raise SystemExit(f"HTML Reel is not 18 seconds: {d}")
          print("HTML 18-second duration check: PASS")
          PY

      - name: Publish Instagram queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          META_API_VERSION: ${{ secrets.META_API_VERSION }}
          META_API_BASE_URL: ${{ secrets.META_API_BASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          FIXED_AUDIO_PATH: ${{ secrets.FIXED_AUDIO_PATH }}
          FIXED_AUDIO_URL: ${{ secrets.FIXED_AUDIO_URL }}
          PUBLISH_WEBSITE: 'false'
          PUBLISH_TO_INSTAGRAM: 'true'
          MAX_ITEMS: '10'
          BOT_REPAIR_ITEMS: '0'
          INSTAGRAM_NEW_ITEMS: '1000'
          INSTAGRAM_RETRY_ITEMS: '1000'
          INSTAGRAM_INTERVAL_MINUTES: '0'
          INSTAGRAM_MAX_PER_RUN: '2'
        run: python scripts/auto_publish.py
