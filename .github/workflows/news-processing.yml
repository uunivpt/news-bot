name: Production Feed Quality Check (No Neon)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "app/**"
      - "scripts/offline_snapshot.py"
      - "scripts/mobile_sync_upload.py"
      - "public/assets/site.js"
      - "public/assets/status.js"
      - ".github/workflows/news-processing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python and published feed without Neon
        env:
          DATABASE_3URL: ""
          DATABASE_URL: ""
          POLITICSHUB_GITHUB_FEED_ONLY: "1"
        run: |
          python -m compileall -q api app scripts
          python -m json.tool public/news-data.json >/dev/null
          python -m unittest discover -s tests -p 'test_public_snapshot_runtime.py' -v
          python -m unittest discover -s tests -p 'test_termux_github_primary.py' -v
