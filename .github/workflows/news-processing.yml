name: News Processing (Production)

permissions:
  contents: write

on:
  push:
    branches:
      - main
  # Stagger away from the top of the hour so GitHub Actions scheduler load
  # does not keep the newsroom job waiting.
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

# Code pushes must never compete with the production newsroom scheduler.
# The newsroom owns its own cadence and runs one collection/publish cycle at a time.
concurrency:
  group: news-processing-production
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: require
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      PHI4_ENABLED: ${{ secrets.PHI4_ENABLED }}
      PHI4_API_KEY: ${{ secrets.PHI4_API_KEY }}
      PHI4_ENDPOINT: ${{ secrets.PHI4_ENDPOINT }}
      PHI4_MODEL: ${{ secrets.PHI4_MODEL }}
      PHI4_TIMEOUT_SECONDS: ${{ secrets.PHI4_TIMEOUT_SECONDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate code and tests
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q app api scripts run.py
          DATABASE_URL="" PGSSLMODE="" python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify database secret
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL GitHub secret is missing."; exit 1; }
      - name: Validate source configuration
        run: python -m json.tool config/sources.json >/dev/null
      - name: Collect fresh sources
        env:
          PYTHONPATH: .
        run: python run.py --once --config config/sources.json
      - name: Repair category routing
        env:
          PYTHONPATH: .
        run: python scripts/repair_news_categories.py
      - name: Publish website queue
        env:
          PYTHONPATH: .
          PUBLISH_WEBSITE: "true"
          PUBLISH_TO_INSTAGRAM: "false"
          MAX_ITEMS: "15"
          BOT_REPAIR_ITEMS: "10"
        run: python scripts/auto_publish.py
      - name: Export public snapshot and sitemaps
        env:
          PYTHONPATH: .
        run: python scripts/export_public_snapshot.py
      - name: Commit public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add public/news-data.json public/static-sitemap.xml public/sitemap.xml public/news-sitemap*.xml
          if git diff --cached --quiet; then
            echo "Public data unchanged."
            exit 0
          fi
          git commit -m "chore: refresh public news snapshot [skip ci]"
          git push origin HEAD:main
