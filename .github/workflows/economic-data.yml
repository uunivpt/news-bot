name: Refresh annual economic data
on:
  schedule:
    - cron: "27 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/economic_data.py"
      - "scripts/refresh_economic_data.py"
      - ".github/workflows/economic-data.yml"
concurrency:
  # Serialize with the existing public snapshot writers to avoid push races.
  group: emergency-public-feed
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify refresh rules before contacting the provider
        run: python -m unittest discover -s tests -p test_economic_data.py -v
      - name: Check latest observations and historical revisions
        id: refresh
        continue-on-error: true
        run: python scripts/refresh_economic_data.py
      - name: Publish verified series, retaining any failed series
        run: |
          git config user.name "politicshub-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/article-visuals.json
          git diff --staged --quiet && exit 0
          git commit -m "Refresh verified annual economic observations"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report provider failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::One or more annual series could not be verified. Their last good data and check dates were preserved."
          exit 1
