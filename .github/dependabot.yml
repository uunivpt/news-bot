version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /reel
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      remotion:
        patterns:
          - remotion
          - "@remotion/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
